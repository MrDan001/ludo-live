name: Cleanup multiplayer menu CSS

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  cleanup:
    if: "!contains(github.event.head_commit.message, '[menu-cleanup-bot]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove remaining menu CSS
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/game-online/page.tsx')
          s = p.read_text()
          old = '.multiplayer-menu-btn span{width:36px;height:5px;border-radius:99px;background:#e0a916}'
          assert s.count(old) == 1, f'Expected one desktop menu span rule, found {s.count(old)}'
          s = s.replace(old, '', 1)
          old_mobile = '.multiplayer-menu-btn span{width:23px;height:3px}'
          assert s.count(old_mobile) == 1, f'Expected one mobile menu span rule, found {s.count(old_mobile)}'
          s = s.replace(old_mobile, '', 1)
          p.write_text(s)
          PY
          git diff --check
          git add app/game-online/page.tsx
          git commit -m "Remove remaining multiplayer menu CSS" -m "[menu-cleanup-bot]"
          git rm .github/workflows/cleanup-multiplayer-menu-css.yml
          git commit --amend --no-edit
          git push