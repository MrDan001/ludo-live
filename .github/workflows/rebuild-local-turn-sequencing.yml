name: Rebuild local turn sequencing
on:
  push:
    branches: [main]
jobs:
  rebuild:
    if: github.event.head_commit.message == 'Temporary build step for local turn sequencing rebuild'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild human-to-bot turn sequencing
        shell: python
        run: |
          from pathlib import Path

          replacements = {
            'app/game/GameBoardContent.tsx': (
              'const handleHumanRoll=(n:DiceFace)=>{if(botThinking||animating||pendingRoll!==null||turn!==0||matchOver)return;setRoll(n);setPendingRoll(n);if(!tokens.some(t=>currentColors.includes(t.color)&&legalMove(t,n))){setPendingRoll(null);finishTurn(n,"You");return}setNotice(`You rolled ${n}. Select a legal token to move.`)};',
              'const handleHumanRoll=(n:DiceFace)=>{if(botThinking||animating||pendingRoll!==null||turn!==0||matchOver)return;setRoll(n);setPendingRoll(n);const hasMove=tokens.some(t=>currentColors.includes(t.color)&&legalMove(t,n));if(!hasMove){setNotice(`You rolled ${n}. No legal move.`);window.setTimeout(()=>{setPendingRoll(null);finishTurn(n,"You")},900);return}setNotice(`You rolled ${n}. Select a legal token to move.`)};'
            ),
            'app/game/TournamentBotGame.tsx': (
              'const handleHumanRoll=(dice:Face)=>{if(botThinking||animating||pendingRoll!==null||turn!==0||winnerRef.current)return;setRoll(dice);if(!hasLegalMove(tokens,HUMAN_COLORS,dice)){setPendingRoll(null);setNotice(`You rolled ${dice}. No legal move.`);finishTurn(dice,"You");return}setPendingRoll(dice);setNotice(`You rolled ${dice}. Select a legal token to move.`);persist(tokens,0,dice,dice,sixStreak,botRollKey)};',
              'const handleHumanRoll=(dice:Face)=>{if(botThinking||animating||pendingRoll!==null||turn!==0||winnerRef.current)return;setRoll(dice);setPendingRoll(dice);if(!hasLegalMove(tokens,HUMAN_COLORS,dice)){setNotice(`You rolled ${dice}. No legal move.`);window.setTimeout(()=>{setPendingRoll(null);finishTurn(dice,"You");persist(tokens,1,null,dice,0,botRollKey)},900);return}setNotice(`You rolled ${dice}. Select a legal token to move.`);persist(tokens,0,dice,dice,sixStreak,botRollKey)};'
            )
          }

          for path, (old, new) in replacements.items():
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f'Expected original turn handler not found in {path}')
              p.write_text(text.replace(old, new, 1))

          wf = Path('.github/workflows/rebuild-local-turn-sequencing.yml')
          wf.unlink()

      - name: Commit rebuilt flow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/game/GameBoardContent.tsx app/game/TournamentBotGame.tsx .github/workflows/rebuild-local-turn-sequencing.yml
          git commit -m "Rebuild local human turn sequencing"
          git push
