name: Remove multiplayer hamburger

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  remove-hamburger:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove all hamburger implementations
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          # Remove the known multiplayer hamburger from the legacy online route,
          # including its layout column so no empty slot remains.
          p = Path('app/game-online/page.tsx')
          s = p.read_text()
          s = re.sub(r'\n\s*<button type="button" className="ll-menu-btn" aria-label="Menu">.*?</button>', '', s, flags=re.S)
          s = s.replace('grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr) 58px;', 'grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr);')
          s = re.sub(r'\n\s*\.ll-menu-btn\s*\{.*?\}\s*\.ll-menu-btn span\s*\{.*?\}', '', s, flags=re.S)
          s = s.replace('grid-template-columns: minmax(0, 1fr) 92px minmax(0, 1fr) 48px;', 'grid-template-columns: minmax(0, 1fr) 92px minmax(0, 1fr);')
          s = re.sub(r'\n\s*\.ll-menu-btn\s*\{[^}]*\}\s*\.ll-menu-btn span\s*\{[^}]*\}', '', s)
          p.write_text(s)

          # Remove the older shared in-game communications menu too.
          p = Path('app/_components/InGameComms.tsx')
          s = p.read_text()
          s = re.sub(r'\s*<button[^>]*className="menu-btn"[^>]*>.*?</button>', '', s, flags=re.S)
          s = s.replace('grid-template-columns:1fr 150px 1fr 62px;', 'grid-template-columns:1fr 150px 1fr;')
          s = s.replace('grid-template-columns:1fr 1fr 44px;', 'grid-template-columns:1fr 1fr;')
          s = re.sub(r'\.menu-btn\s*\{[^}]*\}', '', s)
          p.write_text(s)
          PY

          if grep -RniE 'll-menu-btn|className="menu-btn"|\.menu-btn|☰' app 2>/dev/null; then
            echo 'Hamburger implementation still present in app source.'
            exit 1
          fi

      - name: Commit cleanup and remove this temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/game-online/page.tsx app/_components/InGameComms.tsx .github/workflows/remove-multiplayer-hamburger.yml
          git diff --cached --quiet && { echo 'No source changes required.'; exit 0; }
          git commit -m "fix: remove all multiplayer hamburger implementations"
          git rm .github/workflows/remove-multiplayer-hamburger.yml
          git commit -m "chore: remove temporary hamburger cleanup workflow"
          git push origin HEAD:main
