name: Fix room host recovery
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/fix-room-host.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch realtime room host recovery
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('server.js')
          s=p.read_text()
          old=s
          s=s.replace('({roomCode,name,roomSize,playerId,board,dice}={})','({roomCode,name,roomSize,playerId,board,dice,host}={})')
          s=s.replace('if(!room)room={code,hostId:socket.id,roomSize:Number(roomSize)||4,members:new Map(),game:null};','if(!room)room={code,hostId:socket.id,hostPlayerId:host?pid:null,roomSize:Number(roomSize)||4,members:new Map(),game:null};')
          s=s.replace('if(room.members.size>=room.roomSize&&!existingEntry)return socket.emit(\'room-error\',\'Room is full\');','if(room.members.size>=room.roomSize&&!existingEntry)return socket.emit(\'room-error\',\'Room is full\');')
          s=s.replace('if(member.host)room.hostId=socket.id;room.members.set(socket.id,member)','if(host&&pid){member.host=true;member.ready=true;room.hostPlayerId=pid;room.hostId=socket.id}else if(member.host){room.hostId=socket.id}room.members.set(socket.id,member)')
          s=s.replace('room.members.set(socket.id,{id:socket.id,playerId:pid,name:String(name).slice(0,24),host:socket.id===room.hostId,ready:socket.id===room.hostId,peerId:null,board:String(board||\'classic\'),dice:String(dice||\'classic\'),socketId:socket.id})','room.members.set(socket.id,{id:socket.id,playerId:pid,name:String(name).slice(0,24),host:!!host||socket.id===room.hostId,ready:!!host||socket.id===room.hostId,peerId:null,board:String(board||\'classic\'),dice:String(dice||\'classic\'),socketId:socket.id});if(host&&pid){room.hostPlayerId=pid;room.hostId=socket.id}')
          s=s.replace("socket.on('start-game',()=>{const code=socket.data.roomCode,room=rooms.get(code);if(!room||room.hostId!==socket.id||room.game)return;const members=publicMembers(room);if(members.length===room.roomSize&&members.every(m=>m.ready)){initGame(room);io.to(code).emit('start-game',{board:room.members.get(room.hostId)?.board||'classic',members});emitGame(room)}});", "socket.on('start-game',()=>{const code=socket.data.roomCode,room=rooms.get(code);if(!room){return socket.emit('start-error','Room no longer exists. Please rejoin the room.')}if(room.hostId!==socket.id)return socket.emit('start-error','Only the room host can start the game.');if(room.game)return socket.emit('start-error','Game has already started.');const members=publicMembers(room);if(members.length!==room.roomSize)return socket.emit('start-error',`Waiting for all players (${members.length}/${room.roomSize}).`);if(!members.every(m=>m.ready))return socket.emit('start-error','All players must be ready.');initGame(room);io.to(code).emit('start-game',{board:room.members.get(room.hostId)?.board||'classic',members});emitGame(room)});")
          s=s.replace('if(r.hostId===socket.id){const nextHost=r.members.values().next().value;if(nextHost){r.hostId=nextHost.id;nextHost.host=true;nextHost.ready=true}}','if(r.hostId===socket.id){const nextHost=r.members.values().next().value;if(nextHost){r.hostId=nextHost.id;r.hostPlayerId=nextHost.playerId;nextHost.host=true;nextHost.ready=true}}')
          if s==old:
              raise SystemExit('No server.js changes matched; aborting.')
          p.write_text(s)
          PY
      - name: Commit patched server
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add server.js
          git diff --cached --quiet && exit 0
          git commit -m 'Fix realtime room host recovery and start errors'
          git push
      - name: Remove one-time patch workflow
        run: |
          git rm .github/workflows/fix-room-host.yml
          git commit -m 'Remove one-time room host patch workflow'
          git push
