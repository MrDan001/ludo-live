name: Fix dice shop rendering

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: "!contains(github.event.head_commit.message, '[skip dice patch]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Make dice catalog rendering explicit
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('app/shop/page.tsx')
          s = p.read_text()
          old = '{tab==="Dice"&&<section className="collection-section"><div className="section-heading"><div><div className="section-icon">🎲</div><div><h2>Dice Skins</h2><p>Roll in style.</p></div></div><strong>Small change, big style.</strong></div><div className="dice-grid">{dice.map(renderDiceCard)}</div></section>}'
          new = '{tab==="Dice"&&<section className="collection-section" style={{display:"block",visibility:"visible",opacity:1,minHeight:200}}><div className="section-heading"><div><div className="section-icon">🎲</div><div><h2>Dice Skins</h2><p>Roll in style.</p></div></div><strong>Small change, big style.</strong></div><div className="dice-grid" style={{display:"grid",visibility:"visible",opacity:1}}>{dice.map(renderDiceCard)}</div></section>}'
          if old not in s:
              raise SystemExit('dice section pattern not found')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/shop/page.tsx
          git diff --cached --quiet && exit 0
          git commit -m 'Force dice catalog visibility [skip dice patch]'
          git push
      - name: Remove patch workflow
        if: success()
        run: |
          git rm .github/workflows/fix-dice-shop.yml || true
          git commit -m 'Remove one-time dice shop patch workflow [skip dice patch]' || true
          git push || true
