name: Repair multiplayer session
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  repair:
    if: contains(github.event.head_commit.message, 'chore: run multiplayer session and voice repair')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch multiplayer lifecycle and voice
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          # server.js: explicit leave, reconnect grace, empty-room cleanup, and one
          # authoritative disconnect handler. The previous repair accidentally left
          # a second legacy disconnect handler in the file, which could undo the
          # reconnect/leave state and leave ghost rooms in the public room list.
          p=Path('server.js'); s=p.read_text()
          old=re.search(r' socket\.on\("disconnect",\(\)=>\{.*?\}\);\n socket\.on\("set-peer-id"',s,re.S)
          if not old: raise SystemExit('disconnect block not found')
          new=''' socket.on("leave-room",()=>{const code=socket.data.roomCode,room=rooms.get(code);if(!room)return socket.emit("room-left",{roomCode:code});const member=room.members.get(socket.id);if(!member)return socket.emit("room-left",{roomCode:code});const wasHost=room.hostId===socket.id||room.hostPlayerId===member.playerId;room.members.delete(socket.id);socket.leave(code);socket.data.roomCode=null;clearTimeout(member.reconnectTimer);if(wasHost){const candidates=[...room.members.values()].filter(m=>m.socketId&&m.connected!==false);if(candidates.length===0){clearTimeout(room.hostTimer);rooms.delete(code)}else{const next=candidates[0];room.hostId=next.id;room.hostPlayerId=next.playerId||next.id;next.host=true;next.ready=true;room.hostPending=false;room.hostEligible=false;clearTimeout(room.hostTimer)}}if(rooms.has(code)){io.to(code).emit("roster",publicMembers(room));broadcastRooms()}else{broadcastRooms()}socket.emit("room-left",{roomCode:code})});
 socket.on("disconnect",()=>{const code=socket.data.roomCode,room=rooms.get(code);if(!room)return;const member=room.members.get(socket.id);if(!member)return;const pid=member.playerId||member.id;const wasHost=room.hostId===socket.id||room.hostPlayerId===pid;member.connected=false;member.socketId=null;member.disconnectedAt=Date.now();if(wasHost){room.hostId=null;room.hostPlayerId=pid;room.hostPending=true;room.hostEligible=false;clearTimeout(room.hostTimer);room.hostTimer=setTimeout(()=>{const current=rooms.get(code);if(current!==room||!current.hostPending)return;const replacement=[...current.members.values()].find(m=>m.connected!==false&&m.socketId);if(replacement){replacement.host=true;replacement.ready=true;current.hostId=replacement.id;current.hostPlayerId=replacement.playerId||replacement.id;current.hostPending=false;current.hostEligible=false;io.to(code).emit("host-transferred",{playerId:current.hostPlayerId});io.to(code).emit("roster",publicMembers(current));broadcastRooms()}else{rooms.delete(code);kickRoomMembers(room,"The room closed because no player reconnected.");broadcastRooms()}},30000)}else{clearTimeout(member.reconnectTimer);member.reconnectTimer=setTimeout(()=>{const current=rooms.get(code);if(current===room&&current.members.get(socket.id)===member&&member.connected===false){room.members.delete(socket.id);if(room.members.size===0){clearTimeout(room.hostTimer);rooms.delete(code)}io.to(code).emit("roster",publicMembers(room));broadcastRooms()}},30000)}io.to(code).emit("roster",publicMembers(room));broadcastRooms()});
 socket.on("set-peer-id"'''
          s=s[:old.start()]+new+s[old.end():]

          # Remove the duplicate legacy disconnect handler that currently exists
          # later in server.js. There must be exactly one room disconnect handler.
          dup=re.search(r'\n socket\.on\("disconnect",\(\)=>\{const code=socket\.data\.roomCode,r=rooms\.get\(code\);.*?\}\);\n \}\);httpServer\.listen',s,re.S)
          if dup:
              s=s[:dup.start()]+'\n });httpServer.listen'+s[dup.end():]
          elif s.count('socket.on("disconnect"') != 1:
              raise SystemExit(f'unexpected disconnect handler count: {s.count("socket.on(\\"disconnect\\"")}')
          p.write_text(s)

          # LiveSocial: allow RoomPage's explicit Leave Room button to use the authoritative server leave.
          p=Path('app/_components/LiveSocial.tsx'); s=p.read_text()
          marker='   socket.on("kicked",()=>{setNotice("You were removed by the room host.");kickRef.current?.()});'
          if marker in s and 'window.addEventListener("ludo-leave-room"' not in s:
              insert=marker+'\n   const leaveHandler=()=>{socket.emit("leave-room")}; window.addEventListener("ludo-leave-room",leaveHandler);'
              s=s.replace(marker,insert)
          oldret='   return()=>{cancelled=true;if(startTimerRef.current!==null)window.clearTimeout(startTimerRef.current);socket.disconnect();socketRef.current=null};'
          newret='   return()=>{cancelled=true;if(startTimerRef.current!==null)window.clearTimeout(startTimerRef.current);window.removeEventListener("ludo-leave-room",leaveHandler);socket.disconnect();socketRef.current=null};'
          if oldret in s:s=s.replace(oldret,newret)
          p.write_text(s)

          # Room page: explicit Leave uses the authoritative server event before navigation.
          p=Path('app/room/page.tsx'); s=p.read_text()
          old='const leave=()=>{localStorage.removeItem(ROOM_KEY);setRoom(null);window.location.href="/lobby"};'
          new='const leave=()=>{window.dispatchEvent(new Event("ludo-leave-room"));setTimeout(()=>{localStorage.removeItem(ROOM_KEY);setRoom(null);window.location.href="/lobby"},250)};'
          if old in s:s=s.replace(old,new)
          p.write_text(s)

          # ChatVoice: keep the canonical implementation and avoid calling with disabled tracks.
          p=Path('app/_components/ChatVoice.tsx'); s=p.read_text()
          old='const callPeer=(id:string)=>{if(!streamRef.current||!peerRef.current||id===selfPeer.current)return;try{const call=peerRef.current.call(id,streamRef.current);call?.on("stream",(s:MediaStream)=>playRemote(id,s))}catch{}};'
          new='const callPeer=(id:string)=>{if(!streamRef.current||!peerRef.current||id===selfPeer.current)return;if(streamRef.current.getAudioTracks().every(t=>!t.enabled))return;try{const call=peerRef.current.call(id,streamRef.current);call?.on("stream",(s:MediaStream)=>playRemote(id,s))}catch{}};'
          if old in s:s=s.replace(old,new)
          p.write_text(s)

          Path('MULTIPLAYER_SESSION.md').write_text('''# Multiplayer Session & Reconnect Rules\n\n## Authority\nThe Socket.IO server is authoritative for room membership. `ludo-room` in localStorage is only a convenience cache and must never be treated as proof that a player is still in a room.\n\n## Explicit Leave\n- Clicking **Leave Room** sends `leave-room` to the server before navigation.\n- If the leaving player is the only member, the server deletes the room immediately and broadcasts the updated room list.\n- If other players remain and the leaver is host, the server transfers host authority to a connected remaining player.\n- A stale room must never remain publicly joinable after its final member leaves.\n\n## Unexpected disconnect\n- A temporary network disconnect is reserved for up to 30 seconds.\n- If the host reconnects with the same authenticated player ID, host authority is restored.\n- If the host does not return, an available connected player becomes host.\n- If nobody remains after the reconnect window, the room closes.\n\n## After game start\nThe canonical game session remains on the server during a temporary disconnect. Rejoining with the same authenticated player ID receives the current `game-state`; players do not create a second match.\n\n## Voice\n`ChatVoice.tsx` remains the single canonical room voice implementation. It uses PeerJS/WebRTC and browser microphone permission. Do not create room-specific duplicate voice implementations.\n\n## Regression guard\nThere must be exactly one Socket.IO room `disconnect` handler. Duplicate legacy disconnect handlers can undo reconnect/leave state and create ghost rooms.\n''')

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add server.js app/_components/LiveSocial.tsx app/room/page.tsx app/_components/ChatVoice.tsx MULTIPLAYER_SESSION.md .github/workflows/repair-multiplayer-session.yml
          git commit -m 'fix: robust multiplayer reconnect and room leave' || exit 0
          git push
