name: Repair multiplayer session
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repair multiplayer dice, captures and reconnect hydration
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          changed = False

          # Dice: 3 must be three pips; 5 must be five pips.
          p = Path('app/_components/DemoDice.tsx')
          s = p.read_text()
          s2 = s.replace('5:[0,4,8]', '5:[0,2,4,6,8]')
          if s2 != s:
              s = s2
              changed = True
          p.write_text(s)

          # Multiplayer board animation: the first server state after a fresh
          # mount/reconnect is a snapshot. Never animate every token from yard
          # into its restored position. Later authoritative states animate normally.
          p = Path('app/_components/LudoBoardMultiplayer.tsx')
          s = p.read_text()
          anchor = 'const[displayTokens,setDisplayTokens]=useState<DemoToken[]>(tokens);const displayRef=useRef(tokens);'
          replacement = anchor + 'const receivedServerStateRef=useRef(false);'
          if 'const receivedServerStateRef=useRef(false);' not in s:
              if anchor not in s:
                  raise SystemExit('display token ref anchor not found')
              s = s.replace(anchor, replacement, 1)
              changed = True

          old = '''if(!mountedRef.current){mountedRef.current=true;displayRef.current=tokens;setDisplayTokens(tokens);return;}\n  if(snapOnUpdate||!animateUpdates){'''
          new = '''if(!mountedRef.current){mountedRef.current=true;displayRef.current=tokens;setDisplayTokens(tokens);return;}\n  // First non-empty server state is hydration, not a movement animation.\n  // This is what makes refresh/reconnect restore tokens instantly.\n  if(!receivedServerStateRef.current){receivedServerStateRef.current=true;Object.values(timersRef.current).forEach(window.clearTimeout);Object.values(launchTimersRef.current).forEach(window.clearTimeout);timersRef.current={};launchTimersRef.current={};setLaunchingKeys(new Set());displayRef.current=Array.from(incoming.values());setDisplayTokens(displayRef.current);return;}\n  if(snapOnUpdate||!animateUpdates){'''
          if old not in s:
              raise SystemExit('hydration effect anchor not found')
          s = s.replace(old, new, 1)

          # Correct capture detection. A capture is when the killer's destination
          # equals an opponent's current cell and that opponent becomes yard in the
          # authoritative state. The previous code incorrectly looked for FINISH.
          old = '''if(to===FINISH_PROGRESS&&from>0){const victim=[...current.values()].find(v=>Number(v.position)>0&&Number(v.position)<FINISH_PROGRESS&&incoming.get(keyOf(v))?.state==="yard"&&v.color!==target.color);if(victim){capturePairs.push({killerKey:key,killerFrom:from,capturedKey:keyOf(victim),capturedFrom:Number(victim.position)});continue;}}'''
          new = '''if(to>0&&to<FINISH_PROGRESS&&from!==to){const victim=[...current.values()].find(v=>Number(v.position)===to&&Number(v.position)>0&&Number(v.position)<FINISH_PROGRESS&&incoming.get(keyOf(v))?.state==="yard"&&v.color!==target.color);if(victim){capturePairs.push({killerKey:key,killerFrom:from,capturedKey:keyOf(victim),capturedFrom:Number(victim.position)});continue;}}'''
          if old not in s:
              raise SystemExit('capture detection anchor not found')
          s = s.replace(old, new, 1)

          # At capture, put the victim back into the yard exactly when the killer
          # lands on that square. Do not play a finish sound here. The finish sound
          # is reserved for the actual FINISH_PROGRESS -> center transition.
          old = '''const finished=displayRef.current.map(t=>keyOf(t)===pair.killerKey?{...t,position:FINISH_PROGRESS,state:"finished" as const}:keyOf(t)===pair.capturedKey?{...t,position:0,state:"yard" as const}:t);displayRef.current=finished;setDisplayTokens(finished);emitAudio("capture");emitAudio("finish");delete timersRef.current[pair.killerKey];return;'''
          new = '''const resolved=displayRef.current.map(t=>keyOf(t)===pair.capturedKey?{...t,position:0,state:"yard" as const}:t);displayRef.current=resolved;setDisplayTokens(resolved);emitAudio("capture");delete timersRef.current[pair.killerKey];return;'''
          if old not in s:
              raise SystemExit('capture completion anchor not found')
          s = s.replace(old, new, 1)
          p.write_text(s)

          if not changed and git diff --quiet:
              echo 'No multiplayer repair changes required.'
              exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/_components/DemoDice.tsx app/_components/LudoBoardMultiplayer.tsx
          git commit -m 'fix: repair multiplayer dice captures and reconnect state'
          git push
