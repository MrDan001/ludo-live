name: Repair multiplayer session
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repair multiplayer session, dice audio and reconnect hydration
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          changed = False

          # Multiplayer dice sound: the multiplayer controller already plays the
          # sound from the authoritative game-dice event. DemoDice must not also
          # play it locally, otherwise one roll produces two sounds.
          p = Path('app/_components/DemoDice.tsx')
          s = p.read_text()
          old = 'const startDiceSound=()=>{if(settings.sound&&typeof window!=="undefined")window.dispatchEvent(new CustomEvent("ludo-audio",{detail:"dice"}))};'
          new = 'const startDiceSound=()=>{if(!authoritative&&settings.sound&&typeof window!=="undefined")window.dispatchEvent(new CustomEvent("ludo-audio",{detail:"dice"}))};'
          if old in s:
              s = s.replace(old, new)
              changed = True
          # Safety repair for the dice-face definition; this workflow must never
          # alter the visual pip layout while fixing audio.
          s = s.replace('5:[0,4,8]', '5:[0,2,4,6,8]')
          p.write_text(s)

          # Reconnect hydration: a reconnect/refresh receives the authoritative
          # game-state snapshot. That snapshot is a restore, not a new roll, so it
          # must update the displayed face without replaying the 900ms roll animation
          # or dice sound. A real roll is only animated after the first state snapshot.
          p = Path('app/game/MultiplayerGameCanonical.tsx')
          s = p.read_text()
          if 'const hydratedRef = useRef(false);' not in s:
              anchor = '  const winnerSoundRef = useRef<string | null>(null);'
              replacement = anchor + '\n  const hydratedRef = useRef(false);'
              if anchor not in s:
                  raise SystemExit('winner sound ref anchor not found')
              s = s.replace(anchor, replacement, 1)
              changed = True

          old = '''      nextSocket.on("connect", () => {
        if (!mounted) return;'''
          new = '''      nextSocket.on("connect", () => {
        if (!mounted) return;
        // Every Socket.IO reconnect must hydrate from the server snapshot before
        // any subsequent dice event is treated as a new roll.
        hydratedRef.current = false;'''
          if old in s:
              s = s.replace(old, new, 1)
              changed = True

          old = '''        setRoll(event.value);
        setRemoteRolling(true);
        emitAudio("dice");
        setNotice('''
          new = '''        setRoll(event.value);
        // A game-dice event received before the first authoritative snapshot can
        // only be a stale/replayed event during reconnect. Restore the face but do
        // not spend time animating or playing audio for it.
        if (!hydratedRef.current) {
          setRemoteRolling(false);
          return;
        }
        setRemoteRolling(true);
        emitAudio("dice");
        setNotice('''
          if old in s:
              s = s.replace(old, new, 1)
              changed = True

          old = '''        const accepted = applyServerState(next);
        if (!accepted) return;

        if (next.dice !== null) setRoll(next.dice);'''
          new = '''        const accepted = applyServerState(next);
        if (!accepted) return;

        // This is the authoritative restore point after refresh/reconnect. It is
        // deliberately not passed through the roll animation path.
        hydratedRef.current = true;
        setRemoteRolling(false);
        if (next.dice !== null) setRoll(next.dice);'''
          if old in s:
              s = s.replace(old, new, 1)
              changed = True

          # The previous effect returned cleanup from inside an async function,
          # which React never receives. Keep the actual socket in the effect scope
          # so unmount cleans it up and cannot leave duplicate listeners/connections.
          old = '''  useEffect(() => {
    let mounted = true;

    const connect = async () => {'''
          new = '''  useEffect(() => {
    let mounted = true;
    let activeSocket: Socket | null = null;

    const connect = async () => {'''
          if old in s:
              s = s.replace(old, new, 1)
              changed = True

          old = '''      setSocket(nextSocket);

      const clearDiceTimer = () => {'''
          new = '''      activeSocket = nextSocket;
      setSocket(nextSocket);

      const clearDiceTimer = () => {'''
          if old in s:
              s = s.replace(old, new, 1)
              changed = True

          old = '''      return () => {
        clearDiceTimer();
        clearMoveTimer();
        nextSocket.disconnect();
      };
    };

    void connect();

    return () => {
      mounted = false;
    };'''
          new = '''      return () => {
        clearDiceTimer();
        clearMoveTimer();
        nextSocket.disconnect();
        if (activeSocket === nextSocket) activeSocket = null;
      };
    };

    void connect();

    return () => {
      mounted = false;
      clearTimeout(0);
      if (activeSocket) {
        activeSocket.disconnect();
        activeSocket = null;
      }
    };'''
          if old in s:
              s = s.replace(old, new, 1)
              changed = True
          else:
              # Keep the outer cleanup simple if the inner cleanup has already
              # been repaired by a previous workflow run.
              s = s.replace('''    return () => {
      mounted = false;
    };
  }, [applyServerState, isTournament]);''','''    return () => {
      mounted = false;
      if (activeSocket) {
        activeSocket.disconnect();
        activeSocket = null;
      }
    };
  }, [applyServerState, isTournament]);''',1)

          p.write_text(s)

          if not changed and git diff --quiet; then
            echo 'No multiplayer session repairs required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/_components/DemoDice.tsx app/game/MultiplayerGameCanonical.tsx .github/workflows/repair-multiplayer-session.yml
          git commit -m 'fix: preserve multiplayer dice state across reconnects'
          git push
