name: Repair multiplayer session
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repair authoritative room leave lifecycle
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('server.js')
          s = p.read_text()

          # The deployed architecture already has a reconnect-aware disconnect
          # handler. Do not replace it: that path is intentionally different from
          # an explicit Leave Room action. We only add the authoritative leave event.
          if 'socket.on("leave-room"' not in s:
              anchor = ' socket.on("disconnect",()=>{'
              pos = s.find(anchor)
              if pos < 0:
                  raise SystemExit('room disconnect anchor not found')

              leave = ''' socket.on("leave-room",()=>{const code=socket.data.roomCode,room=rooms.get(code);if(!room)return socket.emit("room-left",{roomCode:code});const member=room.members.get(socket.id);if(!member)return socket.emit("room-left",{roomCode:code});const wasHost=room.hostId===socket.id||room.hostPlayerId===member.playerId;room.members.delete(socket.id);socket.leave(code);socket.data.roomCode=null;if(room.hostTimer)clearTimeout(room.hostTimer);if(room.members.size===0){rooms.delete(code);broadcastRooms();socket.emit("room-left",{roomCode:code});return}if(wasHost){const next=[...room.members.values()].find(m=>m.socketId||m.id);if(next){for(const m of room.members.values())m.host=false;next.host=true;next.ready=true;room.hostId=next.id;room.hostPlayerId=next.playerId||next.id;room.hostPending=false;room.hostEligible=false}}io.to(code).emit("roster",publicMembers(room));broadcastRooms();socket.emit("room-left",{roomCode:code})});
'''
              s = s[:pos] + leave + s[pos:]
              p.write_text(s)

          # Keep the handoff documentation beside the implementation.
          Path('MULTIPLAYER_SESSION.md').write_text('''# Multiplayer Session & Reconnect Rules

## Server authority
The Socket.IO server is authoritative for room membership. `ludo-room` in browser storage is only a convenience cache and never proves that a player is still in a room.

## Explicit Leave Room
The Leave Room action emits `leave-room` before navigation. The server immediately removes that socket from the room.

- If the leaving player was the only member, the room is deleted immediately and removed from Online Players.
- If other players remain and the leaver was host, host authority transfers to a remaining participant.
- The explicit leave path is intentionally separate from `disconnect`: an accidental network/browser disconnect must remain reconnectable.
- A room must never remain publicly joinable solely because its former host disconnected intentionally.

## Accidental disconnect
The existing disconnect/reconnect lifecycle remains unchanged. Temporary disconnects can preserve the room for reconnection and host replacement according to the existing server rules.

## Room sizes
The same lifecycle applies to 2-player and 4-player rooms. A 4-player room with only its creator is deleted immediately when that creator explicitly leaves; it is not treated as an active room waiting for a replacement host.

## Voice
`ChatVoice.tsx` remains the canonical room voice implementation. Do not create a second room voice transport.
''')

          # Make the workflow idempotent: after the repair commit, a subsequent run
          # finds the handler and makes no further source change.
          if git diff --quiet; then
            echo 'No multiplayer repair changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add server.js MULTIPLAYER_SESSION.md
          git commit -m 'fix: authoritative multiplayer room leave'
          git push