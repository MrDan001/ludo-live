name: Fix online multiplayer build

on:
  push:
    paths:
      - ".github/workflows/fix-online-multiplayer-build.yml"

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove invalid ChatPanel prop
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path("app/game-online/OnlineMultiplayerGame.tsx")
          s = p.read_text()
          old = ' onClose={()=>setChatOpen(false)} reactions={REACTIONS} onReaction={sendChat}'
          new = ' onClose={()=>setChatOpen(false)} onReaction={sendChat}'
          if old not in s:
              raise SystemExit("Expected ChatPanel call pattern not found")
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Commit correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/game-online/OnlineMultiplayerGame.tsx
          git commit -m "Fix multiplayer ChatPanel type error"
          git push
