name: Apply online functional fix v2

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: "!contains(github.event.head_commit.message, '[online-functional-fix-v2]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch online game
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/game-online/page.tsx')
          s = p.read_text()

          def replace_once(old, new, label):
              global s
              if old not in s:
                  raise SystemExit(f'missing pattern: {label}')
              s = s.replace(old, new, 1)

          replace_once('import LudoBoard, { type BoardThemeId, type DemoToken } from "../_components/LudoBoardMultiplayer";', 'import CanonicalLudoBoard, { type BoardThemeId, type DemoToken } from "../_components/CanonicalLudoBoard";', 'board import')
          replace_once('type Player = { playerId: string; name: string; seat: number; colors?: Color[]; level?: number; avatar?: string; coins?: number };', 'type Player = { playerId: string; name: string; seat: number; colors?: Color[]; level?: number; avatar?: string; coins?: number; peerId?: string };', 'player type')

          old_norm = 'const normalizeTokens = (serverTokens: TokenMap): DemoToken[] => COLORS.flatMap((color) => Array.from({ length: 4 }, (_, id) => { const raw = serverTokens?.[color]?.[String(id)]?.position; const position = typeof raw === "number" && Number.isFinite(raw) ? raw : 0; return { color, id, position, state: position === 0 ? ("yard" as const) : position === FINISH ? ("finished" as const) : position > 51 ? ("home" as const) : ("track" as const) }; }));'
          new_norm = '''const normalizeTokens = (serverTokens: TokenMap): DemoToken[] => {
            const positions: Partial<Record<`${Color}:${number}`, number>> = {};
            Object.values(serverTokens || {}).forEach((playerTokens) => Object.entries(playerTokens || {}).forEach(([key, token]) => {
              if (!/^(red|yellow|green|blue):[0-3]$/.test(key)) return;
              const position = Number(token?.position);
              if (Number.isFinite(position)) positions[key as `${Color}:${number}`] = position;
            }));
            return COLORS.flatMap((color) => Array.from({ length: 4 }, (_, id) => {
              const position = positions[`${color}:${id}`] ?? 0;
              return { color, id, position, state: position === 0 ? ("yard" as const) : position === FINISH ? ("finished" as const) : position > 51 ? ("home" as const) : ("track" as const) };
            }));
          };'''
          replace_once(old_norm, new_norm, 'token normalization')

          replace_once('  const [game, setGame] = useState<GameState | null>(null);\n', '  const [game, setGame] = useState<GameState | null>(null);\n  const [roster, setRoster] = useState<Player[]>([]);\n', 'roster state')
          replace_once('  const [chatOpen, setChatOpen] = useState(false);\n', '  const [chatOpen, setChatOpen] = useState(false);\n  const [chatUnread, setChatUnread] = useState(false);\n  const chatOpenRef = useRef(false);\n', 'chat unread state')
          replace_once('  const revisionRef = useRef(-1);\n', '  const revisionRef = useRef(-1);\n\n  useEffect(() => { chatOpenRef.current = chatOpen; }, [chatOpen]);\n', 'chat open ref')

          a = s.index('  const players = useMemo(() => {')
          b = s.index('\n\n  const mine =', a)
          s = s[:a] + '''  const players = useMemo(() => {
            const gameById = new Map((game?.players || []).map((p) => [String(p.playerId), p]));
            if (roster.length) return roster.map((member) => {
              const merged = { ...gameById.get(String(member.playerId)), ...member } as Player;
              return String(member.playerId) === String(me) ? { ...merged, name: merged.name || myName, level: Number(merged.level) > 0 ? Number(merged.level) : myLevel, avatar: merged.avatar || myAvatarUrl, coins: Number.isFinite(Number(merged.coins)) ? Number(merged.coins) : myCoins } : merged;
            });
            if (game?.players?.length) return game.players.map((p) => String(p.playerId) === String(me) ? { ...p, name: p.name || myName, level: Number(p.level) > 0 ? Number(p.level) : myLevel, avatar: p.avatar || myAvatarUrl, coins: Number.isFinite(Number(p.coins)) ? Number(p.coins) : myCoins } : p);
            return myName ? [{ playerId: me || "1", name: myName, level: myLevel, avatar: myAvatarUrl, coins: myCoins, seat: 0 }] : [];
          }, [game?.players, roster, me, myName, myAvatarUrl, myLevel, myCoins]);''' + s[b:]

          replace_once('.map((t) => `${t.color}:${t.id}`)', '.map((t) => `${t.color}-${t.id}`)', 'legal token key format')

          old_roster = 'localSocket.on("roster", (members: Player[]) => setGame((g) => g ? { ...g, players: members } : { status: "waiting", currentPlayerId: null, dice: null, pendingMove: null, players: members, tokens: {} }));'
          new_roster = '''localSocket.on("roster", (members: Player[]) => {
            const nextRoster = Array.isArray(members) ? members : [];
            setRoster(nextRoster);
            setGame((g) => g ? { ...g, players: nextRoster } : { status: "waiting", currentPlayerId: null, dice: null, pendingMove: null, players: nextRoster, tokens: {} });
          });'''
          replace_once(old_roster, new_roster, 'roster handler')

          chat_start = s.index('      localSocket.on("chat",')
          chat_end = s.index('      localSocket.on("game-state",', chat_start)
          new_chat = '''      localSocket.on("chat", (message: { id?: string; name?: string; text?: string; at?: number; playerId?: string }) => {
        if (!mounted || !message?.text) return;
        const id = String(message.id || ""), name = String(message.name || "Player"), text = String(message.text), at = Number(message.at || Date.now());
        setChatMessages((items) => {
          if (id && items.some((item) => item.id === id)) return items;
          const duplicate = items.find((item) => item.id.startsWith("local-") && item.name === name && item.text === text && Math.abs(item.at - at) < 5000);
          if (duplicate) return items;
          return [...items.slice(-99), { id: id || `remote-${at}`, name, text, at }];
        });
        if (!chatOpenRef.current && String(message.playerId || "") !== String(playerId)) setChatUnread(true);
      });
'''
          s = s[:chat_start] + new_chat + s[chat_end:]

          replace_once('<div className="ll-board-frame"><LudoBoard theme={theme} demoTokens={tokens} onTokenClick={chooseToken} legalTokenKeys={legalTokenKeys} animateUpdates finishSound /></div>', '<div className="ll-board-frame"><CanonicalLudoBoard theme={theme} demoTokens={tokens} onTokenClick={chooseToken} legalTokenKeys={legalTokenKeys} /></div>', 'canonical board render')
          replace_once('<button type="button" onClick={() => setChatOpen((v) => !v)}><b>•••</b><span>Chat</span></button>', '<button type="button" onClick={() => setChatOpen((v) => { const next = !v; if (next) setChatUnread(false); return next; })}><b>•••</b><span>Chat</span>{chatUnread && <i aria-label="New chat message" style={{ position: "absolute", top: 6, right: 6, width: 8, height: 8, borderRadius: "50%", background: "#ff2941", boxShadow: "0 0 8px #ff2941" }} />}</button>', 'chat button')
          replace_once('members={players.map((p) => ({ id: p.playerId, playerId: p.playerId, name: p.name, online: true }))}', 'members={players.map((p) => ({ id: p.playerId, playerId: p.playerId, name: p.name, online: true, peerId: p.peerId }))}', 'peer ids')
          replace_once('<small>★ {p.level || 1} · {String(p.playerId) === String(me) ? "You" : "In match"}</small>', '<small>★ {p.level || 1} · 🟡 {Number(p.coins || 0).toLocaleString()} · {String(p.playerId) === String(me) ? "You" : "In match"}</small>', 'player balance')
          replace_once('.ll-board-frame>.mp-board-wrap{width:100%!important;height:100%!important;aspect-ratio:1/1!important}.ll-board-frame>.mp-board-wrap>div:first-child{width:100%!important;height:100%!important}', '.ll-board-frame>*{width:100%!important;height:100%!important;aspect-ratio:1/1!important}', 'board sizing selector')
          replace_once('.ll-action-stack button,.ll-mic{width:52px;', '.ll-action-stack button,.ll-mic{width:52px;position:relative;', 'chat indicator anchor')

          p.write_text(s)
          PY
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/game-online/page.tsx
          git rm .github/workflows/fix-chat-state-build.yml .github/workflows/fix-online-functional.yml .github/workflows/fix-online-functional-v2.yml
          git commit -m "Fix online HUD sync, voice peers, chat unread state and canonical board" -m "[online-functional-fix-v2]"
          git push
