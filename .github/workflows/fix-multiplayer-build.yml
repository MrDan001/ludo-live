name: Fix multiplayer build

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: "!contains(github.event.head_commit.message, '[layout-chat-fix-bot]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch actual game-online UI and multiplayer metadata
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app/game-online/page.tsx')
          s=p.read_text()

          replacements = [
            ('''type Player = { playerId: string; name: string; seat: number; colors?: Color[]; level?: number; avatar?: string; coins?: number };''', '''type Player = { playerId: string; name: string; seat: number; colors?: Color[]; level?: number; avatar?: string; coins?: number; peerId?: string };'''),
            ('''  const [chatOpen, setChatOpen] = useState(false);''', '''  const [chatOpen, setChatOpen] = useState(false);\n  const [chatUnread, setChatUnread] = useState(false);'''),
            ('''  const myTurn = game ? String(game.currentPlayerId || "") === String(me) : true;''', '''  const myTurn = game ? String(game.currentPlayerId || "") === String(me) : false;'''),
            ('''      localSocket.on("roster", (members: Player[]) => { setGame((g) => (g ? { ...g, players: members } : { status: "waiting", currentPlayerId: null, dice: null, pendingMove: null, players: members, tokens: {} })); });''', '''      localSocket.on("roster", (members: Player[]) => { setGame((g) => { const previous = g?.players || []; const merged = members.map((incoming) => { const old = previous.find((p) => String(p.playerId) === String(incoming.playerId)); return { ...old, ...incoming, name: incoming.name || old?.name || "Player", avatar: incoming.avatar ?? old?.avatar, level: incoming.level ?? old?.level, coins: incoming.coins ?? old?.coins, peerId: incoming.peerId ?? old?.peerId }; }); return g ? { ...g, players: merged } : { status: "waiting", currentPlayerId: null, dice: null, pendingMove: null, players: merged, tokens: {} }; }); });'''),
            ('''      localSocket.on("chat", (message: { id?: string; name?: string; text?: string; at?: number }) => { if (!mounted || !message?.text) return; const id = String(message.id || ""); const name = String(message.name || "Player"); const text = String(message.text); const at = Number(message.at || Date.now()); setChatMessages((items) => { if (id && items.some((item) => item.id === id)) return items; const duplicateLocal = items.find((item) => item.id.startsWith("local-") && item.name === name && item.text === text && Math.abs(item.at - at) < 5000); if (duplicateLocal) return items; return [...items.slice(-99), { id: id || `remote-${at}`, name, text, at }]; }); });''', '''      localSocket.on("chat", (message: { id?: string; name?: string; text?: string; at?: number }) => { if (!mounted || !message?.text) return; const id = String(message.id || ""); const name = String(message.name || "Player"); const text = String(message.text); const at = Number(message.at || Date.now()); setChatMessages((items) => { if (id && items.some((item) => item.id === id)) return items; const duplicateLocal = items.find((item) => item.id.startsWith("local-") && item.name === name && item.text === text && Math.abs(item.at - at) < 5000); if (duplicateLocal) return duplicateLocal ? items : [...items.slice(-99), { id: id || `remote-${at}`, name, text, at }]; }); if (!chatOpen) setChatUnread(true); });'''),
            ('''  const handleRoll = useCallback(() => { if (!socket || !game) { setRoll((Math.floor(Math.random() * 6) + 1) as DiceValue); return; } if (!myTurn || pending !== null || animating || remoteRolling) return; socket.emit("game-roll"); }, [socket, game, myTurn, pending, animating, remoteRolling]);''', '''  const handleRoll = useCallback(() => { if (!socket?.connected || !game) return; if (!myTurn || pending !== null || animating || remoteRolling) return; socket.emit("game-roll"); }, [socket, game, myTurn, pending, animating, remoteRolling]);'''),
            ('''  const sendQuickReaction = (text: string) => { setChatText(text); setChatOpen(true); };''', '''  const sendQuickReaction = (text: string) => { setChatText(text); setChatOpen(true); setChatUnread(false); };'''),
            ('''  const sendChatMessage = () => { const text = chatText.trim(); if (!text || !socket?.connected) return; const now = Date.now(); setChatMessages((items) => [...items.slice(-99), { id: `local-${now}`, name: mine?.name || myName || "Player", text, at: now }]); socket.emit("chat", { text }); setChatText(""); };''', '''  const sendChatMessage = () => { const text = chatText.trim(); if (!text || !socket?.connected) return; const now = Date.now(); setChatMessages((items) => [...items.slice(-99), { id: `local-${now}`, name: mine?.name || myName || "Player", text, at: now }]); socket.emit("chat", { text }); setChatText(""); setChatUnread(false); };'''),
            ('''onClick={() => setChatOpen((v) => !v)} aria-expanded={chatOpen}''', '''onClick={() => setChatOpen((v) => { const next = !v; if (next) setChatUnread(false); return next; })} aria-expanded={chatOpen}'''),
            ('''<span>Chat</span>''', '''<span>Chat{chatUnread && <span className="ll-chat-unread" aria-label="New message">●</span>}</span>'''),
            ('''<ChatVoice roomCode={roomCode} playerId={me} members={players.map((p) => ({ id: p.playerId, playerId: p.playerId, name: p.name, online: true }))} />''', '''<ChatVoice socket={socket} roomCode={roomCode} playerId={me} members={players.map((p) => ({ id: p.playerId, playerId: p.playerId, name: p.name, online: true, peerId: p.peerId }))} />'''),
          ]
          for old,new in replacements:
              if old not in s:
                  raise SystemExit(f'expected game-online pattern not found: {old[:90]}')
              s=s.replace(old,new,1)

          p.write_text(s)

          sp=Path('server.js')
          ss=sp.read_text()
          server_replacements = [
            ('''socket.on('join-room',({roomCode,name,roomSize,playerId,board,dice,host}={})=>{''', '''socket.on('join-room',({roomCode,name,roomSize,playerId,avatar,level,coins,board,dice,host}={})=>{'''),
            ('''member.id=socket.id;member.socketId=socket.id;member.cookie=socket.handshake.headers.cookie||member.cookie||'';''', '''member.id=socket.id;member.socketId=socket.id;member.connected=true;clearTimeout(member.reconnectTimer);member.reconnectTimer=null;member.cookie=socket.handshake.headers.cookie||member.cookie||'';'''),
            ('''member.name=String(name).slice(0,24);member.avatar=String(avatar||member.avatar||'');member.board=''', '''member.name=String(name).slice(0,24);member.avatar=String(avatar??member.avatar??'');member.level=Number(level)||member.level||1;member.coins=Number.isFinite(Number(coins))?Number(coins):(member.coins??0);member.board='''),
            ('''socket.id,playerId:pid,name:String(name).slice(0,24),avatar:String(avatar||''),host:''', '''socket.id,playerId:pid,name:String(name).slice(0,24),avatar:String(avatar||''),level:Number(level)||1,coins:Number.isFinite(Number(coins))?Number(coins):0,host:'''),
            ('''players:members.map((m,i)=>({playerId:m.playerId||m.id,name:m.name,avatar:m.avatar||'',seat:i}))''', '''players:members.map((m,i)=>({playerId:m.playerId||m.id,name:m.name,avatar:m.avatar||'',level:Number(m.level)||1,coins:Number.isFinite(Number(m.coins))?Number(m.coins):0,peerId:m.peerId||null,seat:i}))'''),
          ]
          for old,new in server_replacements:
              if old not in ss:
                  raise SystemExit(f'expected server pattern not found: {old[:100]}')
              ss=ss.replace(old,new,1)
          sp.write_text(ss)
          PY
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/game-online/page.tsx server.js
          git commit -m "Harden game-online multiplayer state" -m "[layout-chat-fix-bot]"
          git push
