name: One-shot server lifecycle fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: "!contains(github.event.head_commit.message, '[server-lifecycle-fix-bot]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply exact multiplayer lifecycle fix
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          # Prevent /game-online from creating a second socket just because the
          # roomCode state is synchronized from the query string.
          page = Path('app/game-online/page.tsx')
          s = page.read_text()
          old_dep = '  }, [applyState, roomCode, params]);'
          new_dep = '  }, [applyState, params]);'
          if old_dep in s:
              s = s.replace(old_dep, new_dep, 1)
          page.write_text(s)

          # Replace the single legacy room disconnect handler in server.js with
          # the reconnect-safe canonical lifecycle. This keeps a player in the
          # room across the normal room -> game page socket transition.
          server = Path('server.js')
          ss = server.read_text()
          pattern = re.compile(r" socket\.on\('disconnect',\(\)=>\{.*?\}\);\n socket\.on\('set-peer-id'", re.S)
          matches = list(pattern.finditer(ss))
          if len(matches) != 1:
              raise SystemExit(f'expected exactly one legacy room disconnect block, found {len(matches)}')

          lifecycle = r''' socket.on("leave-room",()=>{const code=socket.data.roomCode,room=rooms.get(code);if(!room)return socket.emit("room-left",{roomCode:code});const member=room.members.get(socket.id);if(!member)return socket.emit("room-left",{roomCode:code});const wasHost=room.hostId===socket.id||room.hostPlayerId===member.playerId;room.members.delete(socket.id);socket.leave(code);socket.data.roomCode=null;clearTimeout(member.reconnectTimer);if(wasHost){const candidates=[...room.members.values()].filter(m=>m.socketId&&m.connected!==false);if(candidates.length===0){clearTimeout(room.hostTimer);rooms.delete(code)}else{const next=candidates[0];for(const m of room.members.values())m.host=false;next.host=true;next.ready=true;room.hostId=next.id;room.hostPlayerId=next.playerId||next.id;room.hostPending=false;room.hostEligible=false;clearTimeout(room.hostTimer)}}if(rooms.has(code))io.to(code).emit("roster",publicMembers(room));broadcastRooms();socket.emit("room-left",{roomCode:code})});
 socket.on("disconnect",()=>{const code=socket.data.roomCode,room=rooms.get(code);if(room){const member=room.members.get(socket.id);if(member){const pid=member.playerId||member.id;const wasHost=room.hostId===socket.id||room.hostPlayerId===pid;member.connected=false;member.socketId=null;member.disconnectedAt=Date.now();if(wasHost){room.hostId=null;room.hostPlayerId=pid;room.hostPending=true;room.hostEligible=false;clearTimeout(room.hostTimer);room.hostTimer=setTimeout(()=>{const current=rooms.get(code);if(current!==room||!current.hostPending)return;const replacement=[...current.members.values()].find(m=>m.connected!==false&&m.socketId);if(replacement){for(const m of current.members.values())m.host=false;replacement.host=true;replacement.ready=true;current.hostId=replacement.id;current.hostPlayerId=replacement.playerId||replacement.id;current.hostPending=false;current.hostEligible=false;io.to(code).emit("host-transferred",{playerId:current.hostPlayerId});io.to(code).emit("roster",publicMembers(current));broadcastRooms()}else{rooms.delete(code);kickRoomMembers(room,"The room closed because no player reconnected.");broadcastRooms()}},30000)}else{clearTimeout(member.reconnectTimer);member.reconnectTimer=setTimeout(()=>{const current=rooms.get(code);if(current===room&&current.members.get(socket.id)===member&&member.connected===false){room.members.delete(socket.id);if(room.members.size===0){clearTimeout(room.hostTimer);rooms.delete(code)}if(rooms.has(code))io.to(code).emit("roster",publicMembers(room));broadcastRooms()}},30000)}io.to(code).emit("roster",publicMembers(room));broadcastRooms()}}const pid=String(socket.data.playerId||'').trim();if(playerSockets.get(pid)===socket)playerSockets.delete(pid);const cc=socket.data.chatRoomCode,cr=chatRooms.get(cc||'');if(cr){const chatMember=cr.members.get(pid);if(chatMember&&chatMember.socketId===socket.id)chatMember.socketId=null;io.to(`chat:${cc}`).emit('chat-room-members',publicChatMembers(cr));broadcastChatRooms()}});'''

          m = matches[0]
          ss = ss[:m.start()] + lifecycle + "\n socket.on('set-peer-id'" + ss[m.end():]
          server.write_text(ss)
          PY

          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/game-online/page.tsx server.js
          git rm .github/workflows/one-shot-server-lifecycle-fix.yml
          git commit -m "Fix online multiplayer room lifecycle" -m "[server-lifecycle-fix-bot]"
          git push
