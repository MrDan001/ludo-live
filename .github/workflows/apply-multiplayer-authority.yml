name: Apply multiplayer authority patch

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch-server:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch server
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          p = Path('server.js')
          s = p.read_text()
          if '/* MULTIPLAYER_AUTHORITY_WIRED */' in s:
              print('authority already wired')
              raise SystemExit(0)

          imp = "const{Server}=require('socket.io');"
          if imp not in s:
              raise SystemExit('socket.io import not found')
          s = s.replace(imp, imp + "const multiplayerMove=require('./lib/multiplayerMove');", 1)

          pattern = r"socket\.on\('game-move',\(\{tokenId,to\}=\{\}\)=>\{.*?\}\);\n socket\.on\('kick-player'"
          replacement = """/* MULTIPLAYER_AUTHORITY_WIRED */
 socket.on('game-move',({tokenId}={})=>{const room=rooms.get(socket.data.roomCode),g=room?.game,pid=socket.data.playerId;if(!room||!g||g.status!=='playing'||g.currentPlayerId!==pid||!g.pendingMove)return;const rolled=g.pendingMove;if(String(tokenId)==='__skip__'){if(multiplayerMove.legalFor(room,pid,rolled))return;g.pendingMove=null;g.dice=null;if(rolled===6)g.sixStreak+=1;else g.sixStreak=0;const members=[...room.members.values()];const idx=members.findIndex(m=>(m.playerId||m.id)===pid);const forceNext=g.sixStreak>=3;if(forceNext||rolled!==6){g.sixStreak=forceNext?0:g.sixStreak;const next=members[(idx+1)%members.length];g.currentPlayerId=next?.playerId||next?.id||null}emitGame(room);return}const result=multiplayerMove.applyAuthoritativeMove({room,playerId:pid,tokenId,dice:rolled});if(!result.ok)return socket.emit('game-move-error',result.reason);g.pendingMove=null;g.dice=rolled;if(result.won){g.status='finished';g.winnerId=pid;g.currentPlayerId=null;g.pendingMove=null;g.dice=null;io.to(room.code).emit('game-moved',{playerId:pid,tokenId,to:result.to,captured:result.captured});emitGame(room);void recordMatchHistory(room,pid);return}if(rolled===6)g.sixStreak+=1;else g.sixStreak=0;const members=[...room.members.values()];const idx=members.findIndex(m=>(m.playerId||m.id)===pid);const forceNext=g.sixStreak>=3;if(forceNext||rolled!==6){g.sixStreak=forceNext?0:g.sixStreak;const next=members[(idx+1)%members.length];g.currentPlayerId=next?.playerId||next?.id||null}g.dice=null;io.to(room.code).emit('game-moved',{playerId:pid,tokenId,to:result.to,captured:result.captured});emitGame(room)});
 socket.on('kick-player'"""

          s2, n = re.subn(pattern, replacement, s, count=1, flags=re.S)
          if n != 1:
              raise SystemExit('game-move handler not found; server left untouched')
          p.write_text(s2)
          PY

      - name: Commit and push
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add server.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Wire multiplayer authority [authority-wired]'
          git push
