name: Remove multiplayer header menu

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: "!contains(github.event.head_commit.message, '[header-menu-bot]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove menu and center header
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('app/game-online/page.tsx')
          s = p.read_text()

          menu = r'\n?\s*<button type="button" className="multiplayer-menu-btn" aria-label="Open game menu"><span/><span/><span/></button>'
          s, n1 = re.subn(menu, '', s, count=1)
          assert n1 == 1, f'Expected one multiplayer menu button, removed {n1}'

          s, n2 = re.subn(
              r'grid-template-columns:minmax\(0,1fr\) 150px minmax\(0,1fr\) 72px',
              'grid-template-columns:minmax(0,1fr) 150px minmax(0,1fr)',
              s,
              count=1,
          )
          assert n2 == 1, f'Expected desktop topbar grid rule, changed {n2}'

          s, n3 = re.subn(
              r'\.multiplayer-menu-btn\{.*?\}',
              '',
              s,
              count=1,
          )
          assert n3 == 1, f'Expected desktop menu CSS, removed {n3}'

          s, n4 = re.subn(
              r'grid-template-columns:minmax\(0,1fr\) 82px minmax\(0,1fr\) 46px',
              'grid-template-columns:minmax(0,1fr) 82px minmax(0,1fr)',
              s,
              count=1,
          )
          assert n4 == 1, f'Expected mobile topbar grid rule, changed {n4}'

          s, n5 = re.subn(
              r'\.multiplayer-menu-btn\{.*?\}',
              '',
              s,
              count=1,
          )
          assert n5 == 1, f'Expected mobile menu CSS, removed {n5}'

          p.write_text(s)
          PY

          git diff --check
          git diff -- app/game-online/page.tsx
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/game-online/page.tsx
          git commit -m "Remove multiplayer header menu and center header" -m "[header-menu-bot]"
          git rm .github/workflows/remove-multiplayer-menu.yml
          git commit --amend --no-edit
          git push