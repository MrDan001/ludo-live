name: Fix multiplayer voice member type

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: "!contains(github.event.head_commit.message, '[chatvoice-fix]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add required voice member id
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/game-online/page.tsx')
          s = p.read_text()
          old = 'members={players.map((p) => ({ playerId: p.playerId, name: p.name }))}'
          new = 'members={players.map((p) => ({ id: p.playerId, playerId: p.playerId, name: p.name, online: true }))}'
          assert s.count(old) == 1, f'Expected exactly one old ChatVoice member mapping, found {s.count(old)}'
          p.write_text(s.replace(old, new, 1))
          PY
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/game-online/page.tsx
          git commit -m "Fix ChatVoice member typing" -m "[chatvoice-fix]"
          git rm .github/workflows/fix-chatvoice-types.yml
          git commit --amend --no-edit
          git push
