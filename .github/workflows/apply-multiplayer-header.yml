name: Apply multiplayer header reference

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply header
        run: |
          if git log -1 --pretty=%B | grep -Fq '[header-bot]'; then exit 0; fi
          python3 .github/scripts/apply_multiplayer_header.py
          rm .github/scripts/apply_multiplayer_header.py .github/workflows/apply-multiplayer-header.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/game-online/page.tsx .github/scripts/apply_multiplayer_header.py .github/workflows/apply-multiplayer-header.yml
          git commit -m "Polish multiplayer header to source-of-truth" -m "[header-bot]"
          git push
