name: Build Ludo Live avatar assets

on:
  workflow_dispatch:
  push:
    paths:
      - "public/avatars/premium-elite-atlas.svg"
      - ".github/workflows/optimize-avatar-assets.yml"

permissions:
  contents: write

jobs:
  build-avatar-atlas:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install image tools
        run: |
          set -e
          sudo apt-get update
          sudo apt-get install -y imagemagick curl

      - name: Download the approved 30-character source atlas
        run: |
          set -e
          curl -fL \
            "https://raw.githubusercontent.com/MrDan001/ludo-live/bd890aa84f5d70b7dd8f0b731714d0d6035e9987/public/avatars/premium-elite-atlas.jpg" \
            -o /tmp/source-atlas.jpg

          identify /tmp/source-atlas.jpg
          width=$(identify -format '%w' /tmp/source-atlas.jpg)
          height=$(identify -format '%h' /tmp/source-atlas.jpg)
          test "$width" -eq 200
          test "$height" -eq 240

      - name: Split the approved 5x6 atlas into 30 source characters
        run: |
          set -e
          mkdir -p /tmp/avatar-src /tmp/avatar-upscaled /tmp/avatar-final
          n=1
          for row in 0 1 2 3 4 5; do
            for col in 0 1 2 3 4; do
              printf -v id '%02d' "$n"
              convert /tmp/source-atlas.jpg \
                -crop 40x40+$((col * 40))+$((row * 40)) +repage \
                /tmp/avatar-src/avatar-${id}.png
              n=$((n + 1))
            done
          done
          test "$(find /tmp/avatar-src -name 'avatar-*.png' | wc -l)" -eq 30

      - name: Upscale each character with deterministic high-quality CPU processing
        run: |
          set -e
          for input in /tmp/avatar-src/avatar-*.png; do
            name=$(basename "$input" .png)
            convert "$input" \
              -filter Lanczos \
              -resize 240x240! \
              -unsharp 0x1.0+0.75+0.02 \
              -sampling-factor 4:4:4 \
              /tmp/avatar-upscaled/${name}.png
          done
          test "$(find /tmp/avatar-upscaled -name 'avatar-*.png' | wc -l)" -eq 30

      - name: Validate every enhanced character is exactly 240x240
        run: |
          set -e
          for input in /tmp/avatar-upscaled/avatar-*.png; do
            identify -format '%w %h\n' "$input" | grep -qx '240 240'
          done

      - name: Rebuild the 1200x1440 5x6 atlas
        run: |
          set -e
          montage /tmp/avatar-upscaled/avatar-*.png \
            -tile 5x6 \
            -geometry 240x240+0+0 \
            -background none \
            /tmp/premium-elite-atlas.png

          identify /tmp/premium-elite-atlas.png
          width=$(identify -format '%w' /tmp/premium-elite-atlas.png)
          height=$(identify -format '%h' /tmp/premium-elite-atlas.png)
          test "$width" -eq 1200
          test "$height" -eq 1440

          convert /tmp/premium-elite-atlas.png \
            -sampling-factor 4:4:4 \
            -interlace Plane \
            -quality 96 \
            public/avatars/premium-elite-atlas.jpg

          identify public/avatars/premium-elite-atlas.jpg
          width=$(identify -format '%w' public/avatars/premium-elite-atlas.jpg)
          height=$(identify -format '%h' public/avatars/premium-elite-atlas.jpg)
          test "$width" -eq 1200
          test "$height" -eq 1440

      - name: Commit the corrected new-character atlas
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/avatars/premium-elite-atlas.jpg
          if git diff --cached --quiet; then
            echo "No avatar asset changes to commit."
            exit 0
          fi
          git commit -m "Build sharp atlas from approved 30-character source"
          git push
