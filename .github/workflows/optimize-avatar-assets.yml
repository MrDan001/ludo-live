name: Build Ludo Live avatar assets

on:
  workflow_dispatch:
  push:
    paths:
      - "public/avatars/premium-elite-atlas.svg"
      - ".github/workflows/optimize-avatar-assets.yml"

permissions:
  contents: write

jobs:
  build-avatar-atlas:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install SVG rasterizer
        run: |
          set -e
          sudo apt-get update
          sudo apt-get install -y librsvg2-bin imagemagick

      - name: Validate vector atlas source
        run: |
          set -e
          test -s public/avatars/premium-elite-atlas.svg
          grep -q 'width="1200" height="1440" viewBox="0 0 1200 1440"' public/avatars/premium-elite-atlas.svg
          test "$(grep -o '<g transform="translate(' public/avatars/premium-elite-atlas.svg | wc -l)" -eq 30

      - name: Render clean high-resolution raster atlas
        run: |
          set -e
          rsvg-convert \
            --width=4800 \
            --height=5760 \
            --format=png \
            --output=/tmp/premium-elite-atlas.png \
            public/avatars/premium-elite-atlas.svg

          identify /tmp/premium-elite-atlas.png
          width=$(identify -format '%w' /tmp/premium-elite-atlas.png)
          height=$(identify -format '%h' /tmp/premium-elite-atlas.png)
          test "$width" -eq 4800
          test "$height" -eq 5760

          convert /tmp/premium-elite-atlas.png \
            -sampling-factor 4:4:4 \
            -interlace Plane \
            -quality 96 \
            public/avatars/premium-elite-atlas.jpg

          identify public/avatars/premium-elite-atlas.jpg
          width=$(identify -format '%w' public/avatars/premium-elite-atlas.jpg)
          height=$(identify -format '%h' public/avatars/premium-elite-atlas.jpg)
          test "$width" -eq 4800
          test "$height" -eq 5760

      - name: Commit high-resolution raster atlas
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/avatars/premium-elite-atlas.jpg
          if git diff --cached --quiet; then
            echo "No avatar asset changes to commit."
            exit 0
          fi
          git commit -m "Build high-resolution avatar atlas from vector source"
          git push
