name: One-shot game-online board rendering fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: "!contains(github.event.head_commit.message, '[game-online-board-fix]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply rendering-only board sizing fix
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/game-online/page.tsx')
          s = p.read_text()
          marker = '/* FINAL RESPONSIVE BOARD SIZE FIX */'
          if marker not in s:
              fix = '''<style jsx global>{`/* FINAL RESPONSIVE BOARD SIZE FIX */
.ll-board-stage {
  container-type: size;
  container-name: game-board-stage;
}
.ll-board-frame {
  flex: 0 0 auto !important;
}
@supports (width: 100cqw) {
  .ll-board-frame {
    width: min(100cqw, 100cqh) !important;
    height: auto !important;
    max-width: 100% !important;
    max-height: 100% !important;
    aspect-ratio: 1 / 1 !important;
  }
}
@media (max-width:700px) {
  .ll-board-frame > div {
    width:100% !important;
    height:100% !important;
    min-width:0 !important;
    min-height:0 !important;
    aspect-ratio:1 / 1 !important;
  }
}
`}</style>'''
              needle = '</style>\\n    </div></main>'
              if needle not in s:
                  needle = '</style>\n    </div></main>'
              if needle not in s:
                  raise SystemExit('page style terminator not found')
              head, tail = s.rsplit(needle, 1)
              s = head + '</style>\n      ' + fix + '\n    </div></main>' + tail
              p.write_text(s)
          PY
          git diff --check
          rm .github/workflows/one-shot-game-online-board-fix.yml
          git add app/game-online/page.tsx .github/workflows/one-shot-game-online-board-fix.yml
          git commit -m "Fix game-online board responsive sizing" -m "[game-online-board-fix]"
          git push
