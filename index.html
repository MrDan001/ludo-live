<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Ludo Live — Board</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Arial,Helvetica,sans-serif}body{background:#9a5d35;color:#fff;overflow-x:hidden}
body:before{content:"";position:fixed;inset:0;z-index:-1;background:repeating-linear-gradient(8deg,rgba(255,255,255,.035) 0 2px,transparent 2px 10px),repeating-linear-gradient(96deg,rgba(45,20,5,.08) 0 2px,transparent 2px 13px),#92562f}
.page{min-height:100svh;display:flex;justify-content:center;padding:18px 12px 28px}.game{width:min(100%,720px);display:flex;flex-direction:column;align-items:center;gap:14px}.top{width:100%;display:grid;grid-template-columns:64px 1fr 64px;align-items:center}.round{width:54px;height:54px;border-radius:50%;display:grid;place-items:center;font-size:30px;font-weight:900;box-shadow:inset 0 -4px 0 rgba(0,0,0,.22),0 3px 7px rgba(0,0,0,.25)}.menu{background:#0786c7}.close{background:#f20b18}.hand{text-align:center;font-size:46px;line-height:1;filter:drop-shadow(0 3px 1px rgba(0,0,0,.25))}.scores{display:flex;gap:14px}.pill{background:#006579;border-radius:24px;padding:8px 20px;font-size:20px;font-weight:800;box-shadow:inset 0 -2px rgba(0,0,0,.15)}
.choice-tokens{display:flex;justify-content:center;align-items:center;gap:18px;min-height:72px;margin:2px 0 0}.choice-token{width:62px;height:62px;border-radius:50%;border:4px solid rgba(255,255,255,.75);display:grid;place-items:center;font-size:25px;font-weight:900;color:#fff;cursor:pointer;box-shadow:inset 0 5px 7px rgba(255,255,255,.28),0 4px 7px rgba(0,0,0,.35);text-shadow:0 2px 2px rgba(0,0,0,.3);transition:transform .12s,box-shadow .12s}.choice-token:active{transform:scale(.92)}.choice-token.selected{transform:scale(1.08);box-shadow:0 0 0 3px #fff,inset 0 5px 7px rgba(255,255,255,.28),0 5px 9px rgba(0,0,0,.4)}.choice-blue{background:#1768e8}.choice-green{background:#0bb94a}.choice-red{background:#ed1b2f}
.board{width:min(94vw,680px);aspect-ratio:1;display:grid;grid-template-columns:repeat(15,1fr);grid-template-rows:repeat(15,1fr);border:6px solid #1c1c1c;border-radius:22px;overflow:hidden;background:#fff;box-shadow:0 5px 10px rgba(0,0,0,.35);position:relative}
.cell{border:1px solid #c5cdd3;background:#fafafa;position:relative;display:grid;place-items:center}.home{grid-column:span 6;grid-row:span 6;position:relative;border:0}.green{background:#05b53c}.yellow{background:#ffab0b}.red{background:#f20d17}.blue{background:#1964f2}.home-inner{position:absolute;inset:11%;border-radius:7%;background:rgba(255,255,255,.10);display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:8%;padding:3%}.slot{border-radius:50%;background:rgba(255,255,255,.10);border:5px solid rgba(255,255,255,.95);box-shadow:inset 0 3px 4px rgba(0,0,0,.2),0 2px 3px rgba(0,0,0,.2);display:grid;place-items:center;min-width:0}.token{width:82%;aspect-ratio:1;border-radius:50%;border:3px solid rgba(0,0,0,.28);box-shadow:inset 0 5px 6px rgba(255,255,255,.3),0 3px 4px rgba(0,0,0,.25);cursor:pointer;transition:transform .12s}.token:active{transform:scale(.9)}.token.green{background:#20d45d}.token.yellow{background:#ffd21c}.token.red{background:#ff4b4f}.token.blue{background:#4d8cff}
.track{background:#fff}.safe:after{content:'★';font-size:22px;color:#f0a400}.arrow{font-size:22px;color:#222;font-weight:900}.home-label{position:absolute;top:5px;left:0;right:0;text-align:center;font-weight:900;font-size:clamp(12px,2.6vw,20px);text-shadow:0 2px 2px rgba(0,0,0,.45)}
/* Dice stay inside a plain white center box. */
.center{grid-column:7/10;grid-row:7/10;position:relative;background:#fff;display:grid;place-items:center;z-index:5}.center-dice{display:flex;gap:3px;align-items:center;justify-content:center;width:100%;height:100%;background:#fff;border:2px solid rgba(0,0,0,.12);border-radius:12px;box-shadow:0 3px 6px rgba(0,0,0,.18);padding:4px}.die{width:30px;height:30px;border-radius:7px;background:#ef1623;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);padding:5px;box-shadow:inset 0 -3px 0 rgba(0,0,0,.2),0 2px 3px rgba(0,0,0,.3);cursor:pointer}.pip{width:5px;height:5px;background:#fff;border-radius:50%;justify-self:center;align-self:center}.p1{grid-area:2/2}.p2a{grid-area:1/1}.p2b{grid-area:3/3}.p3a{grid-area:1/1}.p3b{grid-area:2/2}.p3c{grid-area:3/3}.p4a{grid-area:1/1}.p4b{grid-area:1/3}.p4c{grid-area:3/1}.p4d{grid-area:3/3}.p5a{grid-area:1/1}.p5b{grid-area:1/3}.p5c{grid-area:2/2}.p5d{grid-area:3/1}.p5e{grid-area:3/3}.p6a{grid-area:1/1}.p6b{grid-area:2/1}.p6c{grid-area:3/1}.p6d{grid-area:1/3}.p6e{grid-area:2/3}.p6f{grid-area:3/3}
.bottom{width:100%;display:flex;justify-content:space-between;align-items:center;padding:0 8px 5px}.history{display:flex;gap:10px}.history span{width:58px;height:58px;border-radius:50%;background:#076a9b;border:3px solid #67b6de;display:grid;place-items:center;font-size:20px;font-weight:900}.turn{background:#005666;border:2px solid rgba(255,255,255,.2);border-radius:35px;padding:20px 50px;font-size:20px;font-weight:900}
@media(max-width:480px){.page{padding:10px 8px 18px}.game{gap:10px}.top{grid-template-columns:52px 1fr 52px}.round{width:48px;height:48px;font-size:25px}.hand{font-size:38px}.scores{gap:8px}.pill{font-size:15px;padding:7px 14px}.choice-tokens{gap:13px;min-height:64px}.choice-token{width:56px;height:56px;font-size:22px}.board{width:min(96vw,680px);border-width:5px;border-radius:18px}.slot{border-width:4px}.center-dice{border-radius:9px;padding:3px}.die{width:27px;height:27px;padding:4px;border-radius:6px}.pip{width:4.5px;height:4.5px}.bottom{padding:0 2px}.history{gap:6px}.history span{width:52px;height:52px}.turn{padding:17px 30px;font-size:17px}}
@media(max-width:360px){.pill{font-size:13px;padding:6px 10px}.round{width:44px;height:44px}.choice-tokens{gap:9px}.choice-token{width:50px;height:50px;font-size:20px}.die{width:24px;height:24px;padding:3px}.pip{width:4px;height:4px}.history span{width:46px;height:46px}.turn{padding:15px 23px;font-size:17px}}
</style>
</head>
<body>
<div class="page"><main class="game">
<header class="top"><div class="round menu">☰</div><div class="hand">☝️</div><div class="round close">×</div></header>
<div class="scores"><div class="pill">Me: 0</div><div class="pill">Player1: 0</div></div>
<div class="choice-tokens" aria-label="Move choices">
  <button class="choice-token choice-blue" id="choice1" aria-label="Play first die">?</button>
  <button class="choice-token choice-green" id="choice2" aria-label="Play second die">?</button>
  <button class="choice-token choice-red" id="choiceSum" aria-label="Play combined dice">?</button>
</div>
<section class="board" aria-label="Ludo board">
<div class="home green" style="grid-column:1/7;grid-row:1/7"><div class="home-label">Player1</div><div class="home-inner"><div class="slot"><div class="token green"></div></div><div class="slot"><div class="token green"></div></div><div class="slot"><div class="token green"></div></div><div class="slot"><div class="token green"></div></div></div></div>
<div class="home yellow" style="grid-column:10/16;grid-row:1/7"><div class="home-label">Player1 →</div><div class="home-inner"><div class="slot"><div class="token yellow"></div></div><div class="slot"><div class="token yellow"></div></div><div class="slot"><div class="token yellow"></div></div><div class="slot"><div class="token yellow"></div></div></div></div>
<div class="home red" style="grid-column:1/7;grid-row:10/16"><div class="home-label">Me</div><div class="home-inner"><div class="slot"><div class="token red"></div></div><div class="slot"><div class="token red"></div></div><div class="slot"><div class="token red"></div></div><div class="slot"><div class="token red"></div></div></div></div>
<div class="home blue" style="grid-column:10/16;grid-row:10/16"><div class="home-label">Me</div><div class="home-inner"><div class="slot"><div class="token blue"></div></div><div class="slot"><div class="token blue"></div></div><div class="slot"><div class="token blue"></div></div><div class="slot"><div class="token blue"></div></div></div></div>
<div id="tracks"></div>
<div class="center"><div class="center-dice" aria-label="Dice"><div class="die" id="d1" aria-label="First die"></div><div class="die" id="d2" aria-label="Second die"></div></div></div>
</section>
<footer class="bottom"><div class="history"><span>0</span><span>0</span><span>0</span></div><div class="turn">Your Turn</div></footer>
</main></div>
<script>
for(let r=0;r<15;r++)for(let c=0;c<15;c++){
 if((r<6||r>=9)&&(c<6||c>=9))continue;
 if(r>=6&&r<9&&c>=6&&c<9)continue;
 const el=document.createElement('div');el.className='cell track';
 if((r===6&&c===1)||(r===8&&c===13)||(r===13&&c===6)||(r===1&&c===8))el.classList.add('safe');
 const a=((r+c)%4===0)?'→':((r+c)%4===1?'↓':((r+c)%4===2?'←':'↑'));el.innerHTML=`<span class="arrow">${a}</span>`;
 el.style.gridRow=r+1;el.style.gridColumn=c+1;document.querySelector('.board').appendChild(el);
}
const faces={1:['p1'],2:['p2a','p2b'],3:['p3a','p3b','p3c'],4:['p4a','p4b','p4c','p4d'],5:['p5a','p5b','p5c','p5d','p5e'],6:['p6a','p6b','p6c','p6d','p6e','p6f']};
let die1=1,die2=1;
function die(el,n){el.innerHTML=faces[n].map(x=>`<i class="pip ${x}"></i>`).join('')}
function updateChoices(){document.getElementById('choice1').textContent=die1;document.getElementById('choice2').textContent=die2;document.getElementById('choiceSum').textContent=die1+die2}
function roll(){die1=1+Math.floor(Math.random()*6);die2=1+Math.floor(Math.random()*6);die(document.getElementById('d1'),die1);die(document.getElementById('d2'),die2);updateChoices()}
function choose(id){document.querySelectorAll('.choice-token').forEach(x=>x.classList.remove('selected'));document.getElementById(id).classList.add('selected')}
roll();
document.getElementById('d1').addEventListener('click',roll);document.getElementById('d2').addEventListener('click',roll);document.getElementById('choice1').addEventListener('click',()=>choose('choice1'));document.getElementById('choice2').addEventListener('click',()=>choose('choice2'));document.getElementById('choiceSum').addEventListener('click',()=>choose('choiceSum'));
</script>
</body></html>
